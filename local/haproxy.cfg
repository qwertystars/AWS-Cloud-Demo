global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode http
    retries 3
    option redispatch
    timeout connect 2s
    timeout client 15s
    timeout server 15s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend http
    bind :80
    default_backend apps

backend apps
    balance leastconn
    option httpchk GET /
    http-check expect status 200
    server app1 app1:80 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server app2 app2:80 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
